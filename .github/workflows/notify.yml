name: Saarthi Push Notifications

on:
  schedule:
    # 6:00 AM IST daily (UTC 00:30) — Morning Suprabhatam, Daily Spot & Festival
    - cron: '30 0 * * *'
    # Friday 6:00 PM IST (UTC 12:30) — Weekend Suggestion
    - cron: '30 12 * * 5'
    # 8:30 AM IST daily (UTC 03:00) — Re-engagement (separate from morning content)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Notification type to send manually'
        required: false
        default: 'good_morning'
        type: choice
        options: [good_morning, daily_spot, festival, weekend, reengagement, welcome]

jobs:
  morning:
    name: Morning Notifications (Suprabhatam + Spot + Festival)
    if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.type == 'good_morning' || github.event.inputs.type == 'daily_spot' || github.event.inputs.type == 'festival' || github.event.inputs.type == 'welcome'))
    runs-on: ubuntu-latest
    steps:
      - name: Validate CRON_SECRET configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub repository secrets. Please add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Send Good Morning Suprabhatam Notification
        if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'good_morning')
        run: |
          IST_HOUR=$(TZ='Asia/Kolkata' date +%H)
          IST_MIN=$(TZ='Asia/Kolkata' date +%M)
          echo "Current IST time: $IST_HOUR:$IST_MIN"
          if [ "$IST_HOUR" -lt 5 ] || [ "$IST_HOUR" -gt 9 ] || ([ "$IST_HOUR" -eq 9 ] && [ "$IST_MIN" -gt 30 ]); then
            echo "Skipping Good Morning notification: IST time ($IST_HOUR:$IST_MIN) is outside morning window (05:00 - 09:30 IST)."
            exit 0
          fi
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"good_morning"}')
          curl_exit=$?
          if [ $curl_exit -ne 0 ]; then
            echo "::error::curl failed with exit code $curl_exit"
            exit $curl_exit
          fi
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2 | tr -d ' \r\n')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ -z "$http_code" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Good Morning dispatch failed with HTTP $http_code"
            exit 1
          fi

      - name: Send Daily Spot of the Day
        if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'daily_spot')
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"daily_spot"}')
          curl_exit=$?
          if [ $curl_exit -ne 0 ]; then
            echo "::error::curl failed with exit code $curl_exit"
            exit $curl_exit
          fi
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2 | tr -d ' \r\n')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ -z "$http_code" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Daily Spot dispatch failed with HTTP $http_code"
            exit 1
          fi

      - name: Send Festival Reminder (if any in 7/3/1/0 days)
        if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'festival')
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"festival"}')
          curl_exit=$?
          if [ $curl_exit -ne 0 ]; then
            echo "::error::curl failed with exit code $curl_exit"
            exit $curl_exit
          fi
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2 | tr -d ' \r\n')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ -z "$http_code" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Festival reminder dispatch failed with HTTP $http_code"
            exit 1
          fi

      - name: Send Welcome Notification (Manual test)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'welcome'
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"welcome"}')
          curl_exit=$?
          if [ $curl_exit -ne 0 ]; then
            echo "::error::curl failed with exit code $curl_exit"
            exit $curl_exit
          fi
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2 | tr -d ' \r\n')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ -z "$http_code" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Welcome notification dispatch failed with HTTP $http_code"
            exit 1
          fi

  weekend:
    name: Weekend Suggestion (Friday evening)
    if: github.event.schedule == '30 12 * * 5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'weekend')
    runs-on: ubuntu-latest
    steps:
      - name: Validate CRON_SECRET configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Send Weekend Yatra Suggestion
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"weekend"}')
          curl_exit=$?
          if [ $curl_exit -ne 0 ]; then
            echo "::error::curl failed with exit code $curl_exit"
            exit $curl_exit
          fi
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2 | tr -d ' \r\n')
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ -z "$http_code" ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Weekend suggestion dispatch failed with HTTP $http_code"
            exit 1
          fi

  reengagement:
    name: Re-engagement (inactive users)
    if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'reengagement')
    runs-on: ubuntu-latest
    steps:
      - name: Validate CRON_SECRET configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: 3-day inactive users
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":3}')
          echo "3-day inactive response: $(echo "$response" | sed '/HTTP_STATUS:/d')"

      - name: 7-day inactive users
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":7}')
          echo "7-day inactive response: $(echo "$response" | sed '/HTTP_STATUS:/d')"

      - name: 15-day inactive users
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":15}')
          echo "15-day inactive response: $(echo "$response" | sed '/HTTP_STATUS:/d')"

      - name: 30-day inactive users
        run: |
          response=$(curl -s -S -L -w "\nHTTP_STATUS:%{http_code}" -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":30}')
          echo "30-day inactive response: $(echo "$response" | sed '/HTTP_STATUS:/d')"
